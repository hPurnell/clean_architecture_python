repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
      - id: ruff-format

  # mypy runs from the project environment rather than mirrors-mypy: pre-commit
  # builds that hook its own venv with none of the dependencies installed, so
  # litestar, dishka, sqlalchemy and the rest resolve to Any and the report is
  # mostly noise about untyped decorators and unsubclassable base classes.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy app tests
        language: system
        types: [python]
        pass_filenames: false