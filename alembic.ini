# Alembic configuration. The connection string is deliberately absent: env.py
# reads DATABASE_URL from app.config, so there is one definition of where the
# database is. Override for a one-off run with:
#
#     alembic -x url=mysql://user:pass@host/other_db upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Date-prefixed filenames, so `ls migrations/versions` reads in the order the
# changes were written rather than in random hash order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Keep generated migrations to the same formatting as the rest of the codebase.
[post_write_hooks]
# exec rather than console_scripts: ruff ships a plain executable and registers
# no console_scripts entry point for Alembic to look up.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
